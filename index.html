<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunéa — Vernis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --shade: #d9568f; --ink: #1c1418; --cream: #f6f1ea; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, sans-serif; color: var(--ink); background: var(--cream); }
  .serif { font-family: "Bodoni Moda", serif; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  img { display: block; }

  header { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; color: #fff; transition: background .3s, color .3s; }
  header.solid { background: rgba(246,241,234,.85); backdrop-filter: blur(12px); color: var(--ink); }
  .logo { letter-spacing: .35em; font-size: 15px; }
  nav { display: flex; gap: 28px; font-size: 12px; }
  nav a { color: inherit; text-decoration: none; }
  .bag { font-size: 12px; padding: 8px 14px; border-radius: 99px; border: 1px solid currentColor; }

  /* Hero: one real hand photo per shade, cross-faded */
  .hero { position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #222; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity 1s, transform 6s ease-out; }
  .hero img.on { opacity: 1; transform: scale(1); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0005, transparent 20%), linear-gradient(90deg, #0007, transparent 55%); }
  .hero-text { position: absolute; z-index: 2; left: 6vw; bottom: 12vh; color: #fff; }
  .hero h1 { font-size: clamp(44px, 7vw, 104px); font-weight: 400; line-height: .95; }
  .hero p { margin-top: 18px; max-width: 340px; font-size: 14px; line-height: 1.6; opacity: .9; }

  .tryon { position: absolute; z-index: 2; right: 32px; top: 50%; transform: translateY(-50%); width: 240px; padding: 18px; border-radius: 22px; background: rgba(255,255,255,.55); backdrop-filter: blur(16px); box-shadow: 0 20px 50px #0003; }
  .tryon small { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; opacity: .6; }
  .tryon h3 { font-size: 34px; font-weight: 400; margin: 4px 0 12px; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 28px; height: 42px; border-radius: 10px 10px 14px 14px; outline-offset: 2px; box-shadow: inset 0 -6px 10px #0002, inset 3px 0 4px #fff5; }
  .swatches button[aria-pressed=true] { outline: 2px solid var(--ink); }
  .add { margin-top: 14px; width: 100%; padding: 11px; border-radius: 99px; background: var(--shade); color: #fff; font-size: 12px; transition: background .7s; }

  /* Collection with real product photos */
  .collection { padding: 90px 6vw; }
  .eyebrow { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; opacity: .6; }
  .collection h2 { font-size: clamp(38px, 6vw, 80px); font-weight: 400; margin: 12px 0 50px; }
  .collection h2 em { color: #c2185b; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }
  .card { background: #fff; border-radius: 999px 999px 90px 90px; padding: 12px 12px 26px; text-align: center; transition: transform .4s, box-shadow .4s; cursor: pointer; }
  .card:hover { transform: translateY(-8px); box-shadow: 0 24px 40px #0001; }
  .disc { aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
  .disc img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .card:hover .disc img { transform: scale(1.1); }
  .card .num { font-size: 9px; margin-top: 16px; opacity: .5; }
  .card h4 { font-family: "Bodoni Moda", serif; font-weight: 400; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; margin: 4px 0; }
  .card .plus { margin-top: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid #0003; }
  .card .plus:hover { background: var(--ink); color: #fff; }
  footer { padding: 30px 6vw; font-size: 11px; opacity: .5; }
  footer a { color: inherit; }

  /* Cart drawer */
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(360px, 100%); background: var(--cream); z-index: 20; padding: 28px; transform: translateX(100%); visibility: hidden; transition: transform .4s, visibility .4s; box-shadow: -20px 0 50px #0002; display: flex; flex-direction: column; }
  .drawer.open { transform: none; visibility: visible; }
  .drawer ul { list-style: none; padding: 0; flex: 1; margin: 24px 0; overflow: auto; }
  .drawer li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #0001; font-size: 14px; }
  .drawer li img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .drawer li span { flex: 1; }
  .checkout { padding: 14px; border-radius: 99px; background: var(--ink); color: #fff; }

  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) {
    nav { display: none; }
    header { padding: 16px; }
    .hero-text { left: 16px; right: 16px; bottom: auto; top: 90px; }
    .tryon { top: auto; bottom: 16px; right: 16px; left: 16px; width: auto; transform: none; }
    .collection { padding: 60px 16px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo serif">LUNÉA</div>
  <nav><a href="#">Teintes</a><a href="#collection">Collection</a><a href="#">À propos</a></nav>
  <button class="bag" id="bagBtn">Panier (<span id="count">0</span>)</button>
</header>

<section class="hero" id="hero">
  <div class="hero-text">
    <h1 class="serif">La couleur,<br><em>sublimée.</em></h1>
    <p>Une formule ultra-brillante, six teintes pensées pour durer dix jours.</p>
  </div>
  <aside class="tryon">
    <small>Essayez-la</small>
    <h3 class="serif" id="shadeName"></h3>
    <div class="swatches" id="swatches"></div>
    <button class="add" id="addHero">Ajouter au panier — 28 €</button>
  </aside>
</section>

<section class="collection" id="collection">
  <div class="eyebrow">— La collection</div>
  <h2 class="serif">Six teintes. <em>une finition.</em></h2>
  <div class="grid" id="grid"></div>
</section>
<footer>Photos : <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> (licence libre) — site de démonstration.</footer>

<aside class="drawer" id="drawer" aria-label="Panier">
  <div style="display:flex;justify-content:space-between"><h3 class="serif">Panier</h3><button id="close" aria-label="Fermer">✕</button></div>
  <ul id="items"></ul>
  <p style="display:flex;justify-content:space-between;margin-bottom:16px"><span>Total</span><b id="total">0 €</b></p>
  <button class="checkout">Commander</button>
</aside>

<script>
// shortcut: photos hot-linked from Unsplash (their API guidelines ask for it); self-host or shoot your own before going live.
const U = (id, w) => `https://images.unsplash.com/${id}?w=${w}&q=80&auto=format&fit=crop`;
const shades = [
  { name: "Nacre",   color: "#e9cbbd", hand: "photo-1772983149677-3b47a14f2fe9", bottle: "photo-1602585578130-c9076e09330d" },
  { name: "Poudre",  color: "#e6b3c0", hand: "photo-1612887390768-fb02affea7a6", bottle: "photo-1544816135-b44f18b3c5d6" },
  { name: "Pivoine", color: "#d66d9a", hand: "photo-1604902396830-aca29e19b067", bottle: "photo-1692881423829-9a2f80d7a84d" },
  { name: "Corail",  color: "#d6202f", hand: "photo-1664650026748-698eefbdd325", bottle: "photo-1667242196625-cba992a860a9" },
  { name: "Prune",   color: "#7d2a55", hand: "photo-1658051054903-a30911f121d3", bottle: "photo-1731056993282-735c259e9085" },
  { name: "Minuit",  color: "#3a1822", hand: "photo-1747095502856-ce86ee935741", bottle: "photo-1512207643973-fef70e8cb699" },
];
const PRICE = 28;
let current = 2, cart = [];
const $ = id => document.getElementById(id);

$("hero").insertAdjacentHTML("afterbegin", shades.map((s, i) =>
  `<img src="${U(s.hand, 1800)}" alt="Main vernie teinte ${s.name}" ${i === current ? "" : 'loading="lazy"'}>`).join(""));
$("swatches").innerHTML = shades.map(s => `<button style="background:${s.color}" aria-label="${s.name}"></button>`).join("");
$("grid").innerHTML = shades.map((s, i) => `<div class="card" data-i="${i}">
  <div class="disc"><img src="${U(s.bottle, 500)}" alt="Flacon ${s.name}" loading="lazy"></div>
  <div class="num">0${i + 1}</div><h4>${s.name}</h4><div>${PRICE} €</div>
  <button class="plus" aria-label="Ajouter ${s.name}" data-add="${i}">+</button></div>`).join("");

function select(i) {
  current = i;
  document.documentElement.style.setProperty("--shade", shades[i].color);
  $("shadeName").textContent = shades[i].name;
  document.querySelectorAll(".hero img").forEach((img, j) => img.classList.toggle("on", i === j));
  [...$("swatches").children].forEach((b, j) => b.setAttribute("aria-pressed", i === j));
}

function add(i) {
  cart.push(i);
  $("count").textContent = cart.length;
  $("items").innerHTML = cart.map(j => `<li><img src="${U(shades[j].bottle, 100)}" alt=""><span>${shades[j].name}</span>${PRICE} €</li>`).join("");
  $("total").textContent = cart.length * PRICE + " €";
  $("drawer").classList.add("open");
}

[...$("swatches").children].forEach((b, i) => b.onclick = () => select(i));
$("grid").onclick = e => {
  if (e.target.dataset.add) return add(+e.target.dataset.add);
  const card = e.target.closest(".card");
  if (card) { select(+card.dataset.i); scrollTo({ top: 0, behavior: "smooth" }); }
};
$("addHero").onclick = () => add(current);
$("bagBtn").onclick = () => $("drawer").classList.add("open");
$("close").onclick = () => $("drawer").classList.remove("open");
select(current);
const hdr = document.querySelector("header");
addEventListener("scroll", () => hdr.classList.toggle("solid", scrollY > innerHeight * 0.6), { passive: true });
</script>
</body>
</html>
